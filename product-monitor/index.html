<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020a11">
    <title>User Screens & Role Requirements</title>
    <link rel="stylesheet" href="/product-monitor/style.css">
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Warehouse Management home">
            <span class="brand-name">Warehouse<span>Management</span></span>
        </a>

        <div class="nav-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
            <a href="#dashboard" data-page="dashboard">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="#inventory" data-page="inventory">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4.3 7.7 7.7 4.4 7.7-4.4M12 12v9M8 5.2l8 4.6"/></svg>
                <span>Inventory</span>
            </a>
            <a href="#aging" data-page="aging">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
                <span>Aging Inventory</span>
            </a>
            <a href="#expiring" data-page="expiring">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-9 4v3m0 0 2-2m-2 2-2-2"/></svg>
                <span>Expiring Products</span>
            </a>
            <a href="#operations" data-page="operations">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5h16M7 12h10M10 17.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
                <span>Operations</span>
            </a>
            <a href="#alerts" data-page="alerts">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
                <span>Alerts</span>
                <span class="nav-count" id="navAlertCount" hidden></span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#settings" data-page="settings">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4L7.3 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1L11 7.4h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z"/></svg>
                <span>Settings</span>
            </a>
            <a href="#logout" data-page="logout">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
                <span>Logout</span>
            </a>
        </div>
        <div class="sidebar-user">
            <span class="avatar">WS</span>
            <span><strong>Warehouse Staff</strong><small>Inventory team</small></span>
            <span class="online-dot" aria-label="Online"></span>
        </div>
    </aside>

    <main class="main-shell">
        <header class="topbar">
            <div class="topbar-copy">
                <p class="eyebrow">WAREHOUSE OPERATIONS</p>
                <h1 id="pageTitle">Warehouse Management</h1>
                <p id="pageSubtitle">Monitor inventory, aging items, and expiration dates.</p>
            </div>
            <div class="topbar-actions">
                <button class="notification-button" id="notificationButton" type="button" aria-label="View alerts">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg>
                    <span id="headerAlertCount" class="notification-count" hidden></span>
                </button>
                <div class="profile">
                    <span class="avatar">WS</span>
                    <span class="profile-copy"><strong>Warehouse Staff</strong><small>Staff account</small></span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
                </div>
            </div>
        </header>

        <section id="appView" class="page-content" aria-live="polite"></section>
    </main>

    <div id="modalLayer" class="modal-layer" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div id="modalContent"></div>
        </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/product-monitor/script.js" defer></script>
</body>
</html>
