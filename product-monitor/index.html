<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020a11">
    <title>User Screens & Role Requirements</title>
    <link rel="stylesheet" href="/product-monitor/style.css?v=distribution-merge-1">
    <link rel="modulepreload" href="/product-monitor/screens/auth.js">
    <link rel="modulepreload" href="/product-monitor/screens/dashboard.js">
    <link rel="modulepreload" href="/product-monitor/screens/inventory.js">
    <link rel="modulepreload" href="/product-monitor/screens/operations.js">
    <link rel="modulepreload" href="/product-monitor/screens/alerts.js">
    <link rel="modulepreload" href="/product-monitor/screens/settings.js">
    <link rel="modulepreload" href="/product-monitor/screens/sales-and-distribution-staff.js">
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Warehouse Management home">
            <span class="brand-name">Warehouse<span>Management</span></span>
        </a>

        <div class="nav-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
            <a href="#dashboard" data-page="dashboard">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1.5"/><rect width="7" height="5" x="14" y="3" rx="1.5"/><rect width="7" height="9" x="14" y="12" rx="1.5"/><rect width="7" height="5" x="3" y="16" rx="1.5"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="#inventory" data-page="inventory">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
                <span>Inventory</span>
            </a>
            <a href="#aging" data-page="aging">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
                <span>Aging Inventory</span>
            </a>
            <a href="#expiring" data-page="expiring">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M12 14v4M12 18h3"/></svg>
                <span>Expiring Products</span>
            </a>
            <a href="#operations" data-page="operations">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg>
                <span>Operations</span>
            </a>
            <a href="#alerts" data-page="alerts">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <span>Alerts</span>
                <span class="nav-count" id="navAlertCount" hidden></span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#settings" data-page="settings">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>Settings</span>
            </a>
            <a href="#logout" data-page="logout">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Logout</span>
            </a>
        </div>
        <div class="sidebar-user">
            <span class="avatar">WS</span>
            <span><strong>Warehouse Staff</strong><small>Inventory team</small></span>
            <span class="online-dot" aria-label="Online"></span>
        </div>
    </aside>

    <main class="main-shell">
        <header class="topbar">
            <div class="topbar-copy">
                <p class="eyebrow">WAREHOUSE OPERATIONS</p>
                <h1 id="pageTitle">Warehouse Management</h1>
                <p id="pageSubtitle">Monitor inventory, aging items, and expiration dates.</p>
            </div>
            <div class="topbar-actions">
                <button class="notification-button" id="notificationButton" type="button" aria-label="View alerts">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    <span id="headerAlertCount" class="notification-count" hidden></span>
                </button>
                <div class="profile">
                    <span class="avatar">WS</span>
                    <span class="profile-copy"><strong>Warehouse Staff</strong><small>Staff account</small></span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>
        </header>

        <section id="appView" class="page-content" aria-live="polite"></section>
    </main>

    <div id="modalLayer" class="modal-layer" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div id="modalContent"></div>
        </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/product-monitor/script.js?v=distribution-merge-1" defer></script>
    <script type="module" src="/product-monitor/main.js?v=distribution-merge-1"></script>
</body>
</html>
